description: PWM with DMA-based WS2812 LED strip controller

compatible: "worldsemi,ws2812-pwm-dma"

include: base.yaml

properties:
  chain-length:
    type: int
    required: true
    description: |
      Number of LEDs in the daisy-chained strip.

  pwm-channel:
    type: phandle-array
    required: true
    specifier-space: pwm
    description: |
      PWM channel to use for sending WS2812 data.
      For STM32, this should be a timer channel capable of 
      PWM output with DMA support.

  dma-channel:
    type: int
    required: true
    description: |
      DMA channel to use for transferring LED data to PWM.

  dma-slot:
    type: int
    required: true
    description: |
      DMA request slot to use for the PWM timer.

  color-mapping:
    type: array
    required: true
    description: |
      Color mapping for the LED strip. Specifies the order that
      LED color information should be sent. The mapping is for
      a single LED. Values should be chosen from the LED_COLOR_ID
      defines in dt-bindings/led/led.h.

      For example, a strip that uses a GRB order would use
      <LED_COLOR_ID_GREEN LED_COLOR_ID_RED LED_COLOR_ID_BLUE>. 