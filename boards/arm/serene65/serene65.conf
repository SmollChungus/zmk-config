# Uncomment these lines below to enable encoders.
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the line below to enable RGB.
# CONFIG_ZMK_RGB_UNDERGLOW=y

# Enable CDC ACM for USB console
# CONFIG_USB_DEVICE_STACK=y
# CONFIG_USB_CDC_ACM=y
# CONFIG_SERIAL=y
# CONFIG_CONSOLE=y
# CONFIG_UART_CONSOLE=y
# CONFIG_UART_LINE_CTRL=y

# USB logging
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG=y

# Basic USB config
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=n
CONFIG_BT=n

CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS = 8000
# All other settings should be in config/serene65.conf to avoid conflicts

CONFIG_ZMK_KSCAN_MOCK_DRIVER=y
CONFIG_KSCAN=y
CONFIG_BOOT_BANNER=y
CONFIG_BOOT_DELAY=100
CONFIG_KSCAN_INIT_PRIORITY=50
CONFIG_KERNEL_INIT_PRIORITY_DEFAULT=40