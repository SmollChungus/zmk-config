CONFIG_ZMK_BLE=n
CONFIG_BT=n

# Disable external power control for RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Enable RGB underglow
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y

# Enable hall effect matrix driver
CONFIG_ZMK_KSCAN_MATRIX_DRIVER=y

# Enable ADC for hall effect sensors
CONFIG_ADC=y

# Enable settings for calibration storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# USB Configuration
CONFIG_USB_DEVICE_PRODUCT="Serene65"
CONFIG_USB_DEVICE_MANUFACTURER="ZMK Project"
CONFIG_USB_DEVICE_VID=0x1D50
CONFIG_USB_DEVICE_PID=0x615E
CONFIG_USB_MAX_POWER=250

# Enable hall effect support
CONFIG_ZMK_HALL_EFFECT=y
CONFIG_ZMK_HALL_EFFECT_CALIBRATION=y
CONFIG_ZMK_HALL_EFFECT_RAPID_TRIGGER=y

# Enable USB 
CONFIG_ZMK_USB=y

# Enable logging but disable USB CDC ACM since it's causing dependency issues
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Force disable conflicting options
CONFIG_ZMK_USB_LOGGING=n
CONFIG_USB_CDC_ACM=n
CONFIG_UART_CONSOLE=n