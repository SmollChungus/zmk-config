CONFIG_ZMK_BLE=n
CONFIG_BT=n

# RGB LED configuration
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_WS2812_STRIP=y
CONFIG_LED_STRIP=y

# Required hardware support
CONFIG_PWM=y
CONFIG_DMA=y
CONFIG_GPIO=y

# USB Configuration
CONFIG_USB_DEVICE_PRODUCT="Serene65"
CONFIG_USB_DEVICE_MANUFACTURER="ZMK Project"
CONFIG_USB_DEVICE_VID=0x1D50
CONFIG_USB_DEVICE_PID=0x615E
CONFIG_USB_MAX_POWER=250

# Prioritize system workqueue
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=-2

# Enable USB device stack
CONFIG_USB_DEVICE_STACK=y

# Enable hall effect matrix driver
CONFIG_ZMK_KSCAN_MATRIX_DRIVER=y

# Enable ADC for hall effect sensors with appropriate configuration
CONFIG_ADC=y
CONFIG_ADC_ASYNC=n
CONFIG_ADC_STM32=y
CONFIG_ADC_INIT_PRIORITY=40
CONFIG_PINCTRL=y

# Enable settings for calibration storage
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# Enable hall effect support
CONFIG_ZMK_HALL_EFFECT=y
CONFIG_ZMK_HALL_EFFECT_CALIBRATION=y
CONFIG_ZMK_HALL_EFFECT_RAPID_TRIGGER=y

# Enable USB logging via ZMK's method
CONFIG_ZMK_USB_LOGGING=y

# Turn on logging with larger buffer for boot messages
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000

# Polling interval in 0.1ms
CONFIG_USB_HID_POLL_INTERVAL_MS=2

# Deep Sleep after 30 minutes of inactivity
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Save settings between reboots
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_SETTINGS_NVS_SECTOR_COUNT=3

# Debug settings
CONFIG_ZMK_LOG_LEVEL_DBG=y

# ZMK general configuration
CONFIG_ZMK_KEYBOARD_NAME="Serene65"